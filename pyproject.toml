[project]
name = "retail-demand-forecasting"
version = "0.1.0"
description = "Grocery demand forecasting on real supermarket data: DuckDB pipeline, baselines, LightGBM and an inventory simulation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
]

[project.scripts]
ingest = "retail_demand.ingest:main"
forecast = "retail_demand.evaluate:main"
figures = "retail_demand.figures:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_demand"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.108",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
